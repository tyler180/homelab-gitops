apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: authentik

  sources:
    - chart: authentik
      helm:
        releaseName: authentik
        valueFiles:
          - $values/platform/authentik/values.yaml
      repoURL: https://charts.goauthentik.io
      targetRevision: 2026.5.6
    - ref: values
      repoURL: https://github.com/tyler180/homelab-gitops.git
      targetRevision: main

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true