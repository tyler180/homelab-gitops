apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clusterissuer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tyler180/homelab-gitops.git
    targetRevision: main
    path: platform/clusterissuer
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: false
      selfHeal: true