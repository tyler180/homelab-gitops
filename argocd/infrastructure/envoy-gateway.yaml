apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.8.2
    helm:
      releaseName: eg
      valueFiles:
        - $values/infrastructure/envoy-gateway/values.yaml
  sources:
    - repoURL: oci://docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.8.2
      helm:
        releaseName: eg
        valueFiles:
          - $values/infrastructure/envoy-gateway/values.yaml
    - repoURL: https://github.com/tyler180/homelab-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true